# Fly.io config. Create the app and volume first (see docs/DEPLOY.md).
app = "hutel"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  CLIENT_ORIGIN = "https://hutel.dk,https://www.hutel.dk,https://hutel.fly.dev"
  ONBOARDING_LOCK = "true"

[[mounts]]
  source = "hutel_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Lobbi Junior (8–12 år) – a completely separate app with its own volume/database.
# Children and adults never share a server. Create once (ask Rune first):
#   fly apps create lobbi-junior
#   fly volumes create junior_data --region arn --size 1 -a lobbi-junior
# Deploy:  fly deploy -c fly.junior.toml
app = "lobbi-junior"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  HUTEL_JUNIOR = "true"
  CLIENT_ORIGIN = "https://junior.lobbi.dk,https://lobbi-junior.fly.dev"
  ONBOARDING_LOCK = "true"

[[mounts]]
  source = "junior_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

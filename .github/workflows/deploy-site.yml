name: Deploy lobbi.dk
# Builds the Astro site and uploads it to Simply (public_html) on every push that changes it.
# One-time setup – add ONE of these repository secrets (Settings → Secrets and variables → Actions):
#   SIMPLY_FTP_PASSWORD  the lobbi.dk product password from Simply's control panel (upload via FTPS)
#   SIMPLY_SSH_KEY       a private key whose public half is added in Simply under "SSH Keys"
# Without a secret the site is still built (so errors show), but nothing is uploaded.
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/shared/**'
      - 'apps/client/src/gfx/**'
      - 'apps/client/src/actors.ts'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
concurrency: deploy-site
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.SIMPLY_SSH_KEY }}
      FTP_PASSWORD: ${{ secrets.SIMPLY_FTP_PASSWORD }}
      PUBLIC_PLAY_URL: ${{ vars.PUBLIC_PLAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hutel/site build
      - name: Upload with SSH (rsync)
        if: env.SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ssh.simply.com >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" apps/site/dist/ lobbi.dk@ssh.simply.com:public_html/
      - name: Upload with FTPS (lftp)
        if: env.SSH_KEY == '' && env.FTP_PASSWORD != ''
        run: |
          # Ubuntu's package mirrors are sometimes unreachable from GitHub: try a few times,
          # and fall back to a small Node FTPS uploader (from npm) if lftp can't be installed.
          for i in 1 2; do
            sudo timeout 90 apt-get install -y -qq -o Acquire::Retries=0 lftp && break
            sudo timeout 90 apt-get update -qq || true
          done
          if command -v lftp >/dev/null; then
            lftp -u "lobbi.dk,$FTP_PASSWORD" ftp.simply.com -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; mirror --reverse --delete --verbose --exclude-glob .git* apps/site/dist/ public_html/; quit"
          else
            echo "::warning::lftp kunne ikke installeres – uploader med basic-ftp (sletter ikke gamle filer)"
            npm i --no-save --prefix /tmp/ftp basic-ftp@5
            NODE_PATH=/tmp/ftp/node_modules node -e '
              const ftp = require("basic-ftp");
              (async () => {
                const c = new ftp.Client(60000);
                await c.access({ host: "ftp.simply.com", user: "lobbi.dk", password: process.env.FTP_PASSWORD, secure: true });
                await c.ensureDir("public_html");
                await c.uploadFromDir("apps/site/dist");
                c.close();
              })().catch((e) => { console.error(e); process.exit(1); });'
          fi
      - name: No upload secret
        if: env.SSH_KEY == '' && env.FTP_PASSWORD == ''
        run: echo "::warning::Tilføj secret SIMPLY_FTP_PASSWORD (eller SIMPLY_SSH_KEY) for at uploade til lobbi.dk"
